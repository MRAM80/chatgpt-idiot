<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 52">
  <!-- hoist arm raising the front of the bin -->
  <polygon points="28,40 40,26 44,40" fill="#f3b04a"/>
  <!-- roll-off bin: cab end lifted, sliding off the rear -->
  <g transform="rotate(-26 14 40)">
    <rect x="10" y="22" width="34" height="17" rx="2.5" fill="#5aab5a"/>
    <rect x="8" y="18.5" width="38" height="5.5" rx="2.75" fill="#94d794"/>
  </g>
  <!-- flatbed -->
  <rect x="12" y="40" width="50" height="6" rx="2" fill="#dcedf4"/>
  <!-- cab silhouette (window + roof) -->
  <path d="M44 23 h6.5 a3 3 0 0 1 2.4 1.2 L58.5 32 h1.5 a2 2 0 0 1 2 2 v6 H44 z" fill="#dcedf4"/>
  <!-- cab body -->
  <path d="M44 29 h5.5 v5 h12.5 v6 H44 z" fill="#5aab5a"/>
  <!-- wheels -->
  <circle cx="24" cy="46" r="5.5" fill="#6d94b5"/>
  <circle cx="24" cy="46" r="2.4" fill="#eaf4f9"/>
  <circle cx="53" cy="46" r="5.5" fill="#6d94b5"/>
  <circle cx="53" cy="46" r="2.4" fill="#eaf4f9"/>
</svg>
